name: Deploy to GitHub Pages

# 每次推到 main 就自動建置 Web 版並部署到 GitHub Pages。
on:
  push:
    branches: [main]
  workflow_dispatch: # 也可以在 Actions 分頁手動觸發

# GitHub Pages 部署所需權限
permissions:
  contents: read
  pages: write
  id-token: write

# 同時只跑一個部署；有新的就取消排隊中的舊部署
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Build & Deploy Web
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Flutter 版本寫死，跟 ci.yml、開發機用同一版——部署出去的就是本機測過的版本
      # （升級步驟見 docs/DEPLOYMENT.md）。
      # 這個 action 是第三方提供的，鎖在固定的 commit（註解是對應版本），標籤被改也不受影響。
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: 3.44.2
          cache: true

      - name: 安裝相依套件
        run: flutter pub get

      # Pages 掛在 /health-diet-app/ 子路徑，base-href 必須對應，
      # 否則資源（含 drift 的 sqlite3.wasm / drift_worker.js）會 404。
      # --csp：要求編譯器不產生「執行時才動態生成程式碼」的寫法（eval 之類），
      # 配合 web/index.html 的對外連線白名單（見 docs/SECURITY.md）。
      - name: 建置 Web 版
        run: flutter build web --release --csp --base-href /health-diet-app/

      # 白名單在 web/index.html 裡平常是註解狀態（開發模式會被它擋住），
      # 只有正式版才打開。找不到標記時這一步會失敗，不會悄悄部署出沒有白名單的版本。
      - name: 啟用對外連線白名單
        run: dart run tool/enable_csp.dart

      # enablement: true → 若 repo 尚未啟用 Pages，會自動啟用（省去手動設定）
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
