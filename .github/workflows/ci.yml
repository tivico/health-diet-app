name: CI

# 每次推到 main 或開 PR 時，自動跑靜態分析與測試。
on:
  push:
    branches: [main]
  pull_request:

jobs:
  analyze-and-test:
    name: Analyze & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Flutter 版本寫死，跟 deploy.yml、開發機用同一版。不寫的話會自動用最新版，
      # 同一份程式碼可能哪天突然檢查不過（升級步驟見 docs/DEPLOYMENT.md）。
      # 這個 action 是第三方提供的，鎖在固定的 commit（註解是對應版本），標籤被改也不受影響。
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: 3.44.2
          cache: true

      # 整合測試會開真實的 SQLite（drift + sqlite3），需要 native library
      - name: 安裝 sqlite3
        run: sudo apt-get update -qq && sudo apt-get install -y libsqlite3-dev

      - name: 安裝相依套件
        run: flutter pub get

      - name: 靜態分析
        run: flutter analyze

      - name: 執行測試
        run: flutter test
